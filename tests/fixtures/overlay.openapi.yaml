openapi: 3.1.0
info:
  title: overlay
  version: "1"
paths:
  /ping:
    post:
      operationId: ping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Wrapped"
      responses:
        "200":
          description: ok
components:
  schemas:
    Base:
      type: object
      properties:
        id:
          type: integer
          minimum: 5
          maximum: 5
    Wrapped:
      $ref: "#/components/schemas/Base"
      properties:
        extra:
          type: string
          const: fixed-extra
